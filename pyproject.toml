[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daliscope"
dynamic = ["version"]
description = "Notebook tools for exploring DALI structural search results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Liisa Holm group"}]
maintainers = [{name = "Liisa Holm group", email = "hao.liu@helsinki.fi"}]
dependencies = [
    "numpy>=1.24", "pandas>=2.2,<3", "scipy>=1.10", "matplotlib>=3.6",
    "plotly>=7.0", "seaborn>=0.12", "scikit-learn>=1.2", "numba>=0.58",
    "logomaker>=0.8", "py3Dmol>=2.0", "pymsaviz>=0.5", "ipywidgets>=8.0",
    "matplotlib-venn>=0.11", "anywidget>=0.9", "IPython>=7.34", "traitlets>=5", "jinja2>=3",
    "infomap>=2.7,<3", "pyroaring>=0.4", "biopython>=1.81",
    "statsmodels>=0.14", "networkx>=3", "pydivsufsort>=0.0.14", "pyarrow>=14",
]

[project.optional-dependencies]
colab = ["ipympl>=0.9", "nbformat>=5"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "ipympl>=0.9", "nbformat>=5"]
packer = ["gemmi>=0.6"]
dev = ["pytest>=8", "build>=1", "nbclient>=0.10"]

[project.urls]
Repository = "https://github.com/Liisa-Holm-group/DaliScope"
Issues = "https://github.com/Liisa-Holm-group/DaliScope/issues"

[project.scripts]
daliscope-pack = "daliscope.packer.make_colab_pack:main"

[tool.setuptools.packages.find]
include = ["daliscope", "daliscope.*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"daliscope.packer" = ["*.csh", "data/pfam_names.tsv", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.dynamic]
version = {attr = "daliscope.__version__"}
